<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<header class="encabezado"><h1>PequeMundo</h1><p>Estamos para ayudarte</p></header>
<nav class="menu"><a href="index.html">Inicio</a><a href="productos.html">Nuestros productos</a><a href="registro.html">Registro</a><a href="contacto.html">Contacto</a></nav>
<main class="contenedor formulario">
<h2>Contacto</h2><p>Si tienes alguna consulta, completa el siguiente formulario.</p>
<form onsubmit="enviarContacto(event)">
<label for="nombre">Nombre</label><input id="nombre" required>
<label for="correo">Correo electrónico</label><input id="correo" type="email" required>
<label for="mensaje">Mensaje</label><textarea id="mensaje" rows="5" required></textarea>
<button class="boton" type="submit">Enviar</button>
<p id="respuesta" role="status"></p>
</form></main>

<script src="script.js"></script>
